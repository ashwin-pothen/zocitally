<vbox id="zocitally-pref-pane"
      xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
      xmlns:html="http://www.w3.org/1999/xhtml"
      onload="ZocitallyPreferences.init()">
  <linkset>
    <html:link rel="localization" href="zocitally.ftl"/>
  </linkset>
  <label><html:h1>Zocitally</html:h1></label>
  <groupbox>
    <label><html:h2>OpenAlex API</html:h2></label>
    <description class="zocitally-help">Singleton DOI lookups work without a key. A free key increases your daily allowance and can be obtained from your OpenAlex account. The key is stored locally in Zotero preferences and is never written to logs by Zocitally.</description>
    <html:label for="zocitally-api-key">API key</html:label>
    <html:input id="zocitally-api-key" type="password" autocomplete="off"
                preference="extensions.zocitally.apiKey"/>
    <hbox>
      <button id="zocitally-open-account" label="Open OpenAlex API Settings"/>
      <button id="zocitally-test-api" label="Test API Connection"/>
    </hbox>
  </groupbox>
  <groupbox>
    <label><html:h2>Refresh behavior</html:h2></label>
    <html:label for="zocitally-refresh-interval">Refresh interval</html:label>
    <html:select id="zocitally-refresh-interval"
                 preference="extensions.zocitally.refreshIntervalDays">
      <html:option value="0">Never automatically</html:option>
      <html:option value="7">7 days</html:option>
      <html:option value="30">30 days</html:option>
      <html:option value="90">90 days</html:option>
    </html:select>
    <html:label for="zocitally-concurrency">Maximum concurrent requests</html:label>
    <html:select id="zocitally-concurrency"
                 preference="extensions.zocitally.maxConcurrency">
      <html:option value="1">1</html:option>
      <html:option value="2">2</html:option>
      <html:option value="3">3</html:option>
      <html:option value="4">4</html:option>
      <html:option value="5">5</html:option>
    </html:select>
    <html:label>
      <html:input id="zocitally-auto-fetch" type="checkbox"
                  preference="extensions.zocitally.autoFetch"/>
      Automatically fetch a small, bounded number of uncached items when they become visible
    </html:label>
    <description class="zocitally-help">Citation data is stored only on this computer in the existing compatible citation-cache database inside the Zotero data directory. It does not sync through Zotero.</description>
  </groupbox>
  <groupbox>
    <label><html:h2>Local cache</html:h2></label>
    <button id="zocitally-clear-cache" label="Clear Cached Citation Data"/>
    <description id="zocitally-pref-status"/>
  </groupbox>
  <groupbox>
    <label><html:h2>About</html:h2></label>
    <description class="zocitally-credit">Built with Claude</description>
    <description class="zocitally-help">Zocitally is an independent community project and is not affiliated with or endorsed by Anthropic, Zotero, or OpenAlex.</description>
  </groupbox>
</vbox>
